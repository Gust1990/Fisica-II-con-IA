    <meta name="theme-color" content="#e67e22">

    <style>
        :root {
            --bg-color: #fdfaf7;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --accent: #e67e22;
            --success: #27ae60;
            --strike: #e74c3c;
            --border-radius: 12px;
            --nav-bg: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 3rem;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            width: 100%;
            background-color: var(--card-bg);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            padding: 1.5rem 1rem 1rem 1rem;
        }

        h1 {
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
            color: var(--text-main);
        }

        .progress-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 22px;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--success);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-text {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 600;
            font-size: 13px;
            line-height: 22px;
            color: #333;
            pointer-events: none;
        }

        nav {
            background-color: var(--nav-bg);
            display: flex;
            justify-content: flex-start;
            overflow-x: auto;
            padding: 0 1rem;
            scrollbar-width: none;
        }
        
        @media (min-width: 900px) {
            nav {
                justify-content: center;
            }
        }

        nav::-webkit-scrollbar {
            display: none;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #ecf0f1;
            padding: 1rem 1.2rem;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            border-bottom: 4px solid transparent;
        }

        .nav-btn:hover {
            background-color: #34495e;
        }

        .nav-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background-color: #34495e;
        }

        .list-container {
            width: 95%;
            max-width: 1200px;
            margin-top: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 1.5rem;
            align-items: start; 
        }

        @media (max-width: 768px) {
            .list-container {
                grid-template-columns: 1fr;
            }
        }

        .topic-group {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #eaeaea;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .topic-header {
            padding: 1rem 1.5rem;
            background-color: #fdf8f5;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px solid #eaeaea;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s;
        }

        .topic-header:hover {
            background-color: #faebd7;
        }

        .subtopics {
            display: flex;
            flex-direction: column;
        }

        .item {
            padding: 0.8rem 1.5rem 0.8rem 3rem;
            border-bottom: 1px solid #f1f1f1;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item:hover {
            background-color: #fafbfc;
        }

        .check-circle {
            width: 20px;
            height: 20px;
            border: 2px solid #bdc3c7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .completed > .check-circle {
            background-color: var(--success);
            border-color: var(--success);
        }

        .completed > .check-circle::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .completed > .text-content {
            text-decoration: line-through;
            text-decoration-color: var(--strike);
            text-decoration-thickness: 2px;
            color: var(--text-muted);
            opacity: 0.8;
        }
        
        .text-content {
            transition: all 0.3s ease;
            flex-grow: 1;
        }

        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            margin-left: auto;
            border-radius: 6px;
            color: #95a5a6;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background-color: #f0e6d2;
            color: var(--accent);
        }

        .copy-btn.copied {
            color: var(--success);
        }
        
        .icon-svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <h1>Programa de Física II <h1>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-text" id="progressText">0% Progreso del Tema</div>
            </div>
        </div>
        <nav id="navMenu">
            <button class="nav-btn active" data-tema="1">T.1: Cuerpos Deformables</button>
            <button class="nav-btn" data-tema="2">T.2: Oscilaciones</button>
            <button class="nav-btn" data-tema="3">T.3: Ondas Mecánicas</button>
            <button class="nav-btn" data-tema="4">T.4: Temp. y Calor. Gases</button>
            <button class="nav-btn" data-tema="5">T.5: 1er Principio</button>
            <button class="nav-btn" data-tema="6">T.6: 2do Principio</button>
            <button class="nav-btn" data-tema="7">T.7: Cambios de Fase</button>
        </nav>
    </header>

    <div class="list-container" id="listContainer">
        </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const data = {
                "1": [
                    {
                        id: "T1_A", 
                        title: "🧱 Elasticidad y Deformaciones",
                        children: [
                            { id: "T1_A1", title: "Nociones de elasticidad, estado de deformaciones y tensiones" },
                            { id: "T1_A2", title: "Ley de Hooke, esfuerzos y módulos de elasticidad: tracción, torsión, compresión" },
                            { id: "T1_A3", title: "Número de Poisson y Energía potencial elástica" }
                        ]
                    },
                    {
                        id: "T1_B", 
                        title: "💧 Hidro y Aerostática",
                        children: [
                            { id: "T1_B1", title: "Líquidos ideales, presión (manométrica y atmosférica)" },
                            { id: "T1_B2", title: "Teorema general de la hidrostática" },
                            { id: "T1_B3", title: "Teoremas de Pascal y de Arquímedes" }
                        ]
                    },
                    {
                        id: "T1_C", 
                        title: "🌊 Hidro y Aerodinámica",
                        children: [
                            { id: "T1_C1", title: "Línea de corriente, flujo estacionario y ecuación de continuidad" },
                            { id: "T1_C2", title: "Teorema de Bernoulli, líquidos viscosos y régimen laminar" },
                            { id: "T1_C3", title: "Distribución de velocidades, caudal, Ley de Poiseuille y Stokes, Número de Reynolds" },
                            { id: "T1_C4", title: "Fenómenos de superficie: tensión superficial, Ley de Laplace y ascenso capilar" }
                        ]
                    }
                ],
                "2": [
                    {
                        id: "T2_A", 
                        title: "⏱️ Movimiento Armónico",
                        children: [
                            { id: "T2_A1", title: "Sistema masa-resorte y ecuación diferencial del movimiento" },
                            { id: "T2_A2", title: "Oscilaciones armónicas simples, péndulo simple, físico y de torsión" },
                            { id: "T2_A3", title: "Superposición de movimientos armónicos simples" }
                        ]
                    },
                    {
                        id: "T2_B", 
                        title: "📉 Oscilaciones Amortiguadas y Forzadas",
                        children: [
                            { id: "T2_B1", title: "Oscilaciones amortiguadas" },
                            { id: "T2_B2", title: "Oscilaciones forzadas y Resonancia" }
                        ]
                    }
                ],
                "3": [
                    {
                        id: "T3_A", 
                        title: "〰️ Propagación y Superposición",
                        children: [
                            { id: "T3_A1", title: "Función de onda, ondas longitudinales, transversales y armónicas" },
                            { id: "T3_A2", title: "Ecuación diferencial del mov. ondulatorio y velocidad de propagación" },
                            { id: "T3_A3", title: "Principio de superposición, interferencia, pulsaciones y reflexión" },
                            { id: "T3_A4", title: "Ondas estacionarias, intensidad de la onda y Efecto Doppler" }
                        ]
                    },
                    {
                        id: "T3_B", 
                        title: "🔊 Acústica",
                        children: [
                            { id: "T3_B1", title: "Caracteres del sonido: altura, frecuencia e intensidad" },
                            { id: "T3_B2", title: "Nivel de intensidad (decibel) y sensación sonora" },
                            { id: "T3_B3", title: "Timbre, armónicos, análisis y síntesis de Fourier" },
                            { id: "T3_B4", title: "Polución sonora y resonancia sonora" }
                        ]
                    }
                ],
                "4": [
                    {
                        id: "T4_A", 
                        title: "🌡️ Temperatura y Calor",
                        children: [
                            { id: "T4_A1", title: "Temperatura, termómetros y escalas. Equilibrio térmico y Ley Cero de la Termodinámica" },
                            { id: "T4_A2", title: "Dilatación, esfuerzos térmicos, calor, calor específico y de transformación" },
                            { id: "T4_A3", title: "Mecanismos de transferencias de calor" }
                        ]
                    },
                    {
                        id: "T4_B", 
                        title: "☁️ Gases y Teoría Cinética",
                        children: [
                            { id: "T4_B1", title: "Acción del calor en gases y ecuación de estado de los gases ideales" },
                            { id: "T4_B2", title: "Teoría Cinética de los gases: Calores específicos y energía interna de un gas ideal" },
                            { id: "T4_B3", title: "Gases reales y Ecuación de Van der Waals" }
                        ]
                    }
                ],
                "5": [
                    {
                        id: "T5_A", 
                        title: "🔥 Primer Principio y Procesos",
                        children: [
                            { id: "T5_A1", title: "Sistemas termodinámicos, Primer principio de la termodinámica y procesos cuasi-estáticos" },
                            { id: "T5_A2", title: "Cálculo de trabajo y la energía interna" },
                            { id: "T5_A3", title: "Procesos adiabáticos: Ecuaciones de Poisson" }
                        ]
                    },
                    {
                        id: "T5_B", 
                        title: "⚙️ Ciclos y Máquinas",
                        children: [
                            { id: "T5_B1", title: "Procesos cíclicos: Ciclo de Carnot" },
                            { id: "T5_B2", title: "Rendimiento termodinámico" },
                            { id: "T5_B3", title: "Máquinas frigoríficas: eficiencia" }
                        ]
                    }
                ],
                "6": [
                    {
                        id: "T6_A", 
                        title: "🎲 Entropía y Procesos",
                        children: [
                            { id: "T6_A1", title: "Segundo Principio de la Termodinámica y Función de entropía" },
                            { id: "T6_A2", title: "Procesos irreversibles y reversibles" },
                            { id: "T6_A3", title: "Cálculo de la variación de entropía" },
                            { id: "T6_A4", title: "La entropía y su formulación estadística" }
                        ]
                    }
                ],
                "7": [
                    {
                        id: "T7_A", 
                        title: "🧊 Cambios de Estado",
                        children: [
                            { id: "T7_A1", title: "Calor de transformación y Puntos fijos" },
                            { id: "T7_A2", title: "Vaporización, evaporación y ebullición" },
                            { id: "T7_A3", title: "Presión del vapor saturado y Ecuación de Clausius-Clapeyron" },
                            { id: "T7_A4", title: "Licuefacción de gases, Efecto Thompson-Joule e Higrometría" }
                        ]
                    }
                ]
            };

            let estado = JSON.parse(localStorage.getItem("progresoFisicaNuevaTemario")) || {};
            let temaActivo = "1";

            const container = document.getElementById('listContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const navButtons = document.querySelectorAll('.nav-btn');

            const svgCopy = `<svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
            const svgCheck = `<svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

            navButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    navButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    temaActivo = e.target.dataset.tema;
                    renderizarLista();
                });
            });

            function renderizarLista() {
                container.innerHTML = '';
                const temasMostrados = data[temaActivo];

                temasMostrados.forEach(grupo => {
                    const groupDiv = document.createElement('div');
                    groupDiv.className = 'topic-group';

                    const textoBloque = `${grupo.title}\n` + grupo.children.map(c => `- ${c.title}`).join('\n') + '\n\nEnseñame todo esto';

                    const headerDiv = document.createElement('div');
                    headerDiv.className = `topic-header ${estado[grupo.id] ? 'completed' : ''}`;
                    headerDiv.innerHTML = `
                        <div class="check-circle"></div>
                        <div class="text-content">${grupo.title}</div>
                        <button class="copy-btn" title="Copiar bloque de temas">${svgCopy}</button>
                    `;
                    
                    headerDiv.addEventListener('click', (e) => {
                        if(e.target.closest('.copy-btn')) return;
                        togglePadre(grupo.id, grupo.children);
                    });

                    const copyBtnPadre = headerDiv.querySelector('.copy-btn');
                    copyBtnPadre.addEventListener('click', (e) => manejarCopia(e, copyBtnPadre, textoBloque));

                    groupDiv.appendChild(headerDiv);

                    const subtopicsDiv = document.createElement('div');
                    subtopicsDiv.className = 'subtopics';

                    grupo.children.forEach(hijo => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = `item ${estado[hijo.id] ? 'completed' : ''}`;
                        itemDiv.innerHTML = `
                            <div class="check-circle"></div>
                            <div class="text-content">${hijo.title}</div>
                        `;

                        itemDiv.addEventListener('click', () => {
                            toggleHijo(hijo.id, grupo.id, grupo.children);
                        });

                        subtopicsDiv.appendChild(itemDiv);
                    });

                    groupDiv.appendChild(subtopicsDiv);
                    container.appendChild(groupDiv);
                });

                actualizarProgresoPorTema();
            }

            function manejarCopia(e, btnElement, texto) {
                e.stopPropagation();
                navigator.clipboard.writeText(texto).then(() => {
                    btnElement.innerHTML = svgCheck;
                    btnElement.classList.add('copied');
                    setTimeout(() => {
                        btnElement.innerHTML = svgCopy;
                        btnElement.classList.remove('copied');
                    }, 1500);
                }).catch(err => console.error('Error al copiar: ', err));
            }

            function togglePadre(idPadre, hijos) {
                const nuevoEstado = !estado[idPadre];
                estado[idPadre] = nuevoEstado;
                hijos.forEach(hijo => estado[hijo.id] = nuevoEstado);
                guardarYRenderizar();
            }

            function toggleHijo(idHijo, idPadre, hermanos) {
                estado[idHijo] = !estado[idHijo];
                const todosCompletados = hermanos.every(h => estado[h.id]);
                estado[idPadre] = todosCompletados;
                guardarYRenderizar();
            }

            function guardarYRenderizar() {
                localStorage.setItem("progresoFisicaNuevaTemario", JSON.stringify(estado));
                renderizarLista();
            }

            function actualizarProgresoPorTema() {
                let totalItems = 0;
                let completados = 0;

                const temasMostrados = data[temaActivo];
                
                temasMostrados.forEach(grupo => {
                    totalItems++; 
                    if (estado[grupo.id]) completados++;

                    grupo.children.forEach(hijo => {
                        totalItems++; 
                        if (estado[hijo.id]) completados++;
                    });
                });

                const porcentaje = totalItems === 0 ? 0 : Math.round((completados / totalItems) * 100);
                progressBar.style.width = porcentaje + '%';
                progressText.textContent = `${porcentaje}% Progreso del Tema ${temaActivo} (${completados}/${totalItems})`;
            }

            Object.values(data).forEach(temas => {
                temas.forEach(grupo => {
                    if (grupo.children.length > 0) {
                        const todosCompletados = grupo.children.every(h => estado[h.id]);
                        if (todosCompletados) estado[grupo.id] = true;
                    }
                });
            });
            
            renderizarLista();
        });
    </script>
</body>
</html>
